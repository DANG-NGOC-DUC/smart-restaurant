name: CI — Continuous Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "backend/package-lock.json"

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Backend Test Suite (Vitest)
        working-directory: backend
        run: npm test

      - name: Run Test Coverage Report
        working-directory: backend
        run: npm run test:coverage

  frontend-test:
    name: Frontend Component & Hook Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Test Suite (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build
